<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Swerve Diffy</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }

        #diffy-model {
            width: 500px;
            height: 500px;
            margin: 50px auto;
            border: 2px solid #FFF;
            border-radius: 5px;
            overflow: hidden;
        }
        canvas { display: block; }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id = "diffy-model"></div>
    <script type="module"> 
        import * as THREE from 'three'; 
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; 
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'; 

        const scene = new THREE.Scene(); 

        // FIX: Find the box element and read its specific 500px layout width/height
        const container = document.getElementById('diffy-model'); 
        const width = container.clientWidth; 
        const height = container.clientHeight; 

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000); 
        const renderer = new THREE.WebGLRenderer({ antialias: true }); 
        
        renderer.setSize(width, height); 
        renderer.setPixelRatio(window.devicePixelRatio); 
        renderer.outputColorSpace = THREE.SRGBColorSpace; 
        
        // FIX: Append the canvas element directly inside the box instead of the body
        container.appendChild(renderer.domElement); 

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); 
        scene.add(ambientLight); 

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0); 
        dirLight1.position.set(5, 10, 7); 
        scene.add(dirLight1); 

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3); 
        dirLight2.position.set(-5, 5, -7); 
        scene.add(dirLight2); 

        const controls = new OrbitControls(camera, renderer.domElement); 
        controls.enableZoom = false; 
        controls.enablePan = false; 
        controls.minPolarAngle = Math.PI / 2.3; 
        controls.maxPolarAngle = Math.PI / 2.3; 
        controls.enableDamping = true; 
        controls.dampingFactor = 0.2; 
        controls.rotateSpeed = 1.1; 
        controls.autoRotate = true; 
        controls.autoRotateSpeed = 0.75; 

        camera.position.set(0, 0, 5); 

        const loader = new GLTFLoader(); 
        loader.load('diffy_module.glb', function (gltf) { 
            const model = gltf.scene; 
            scene.add(model); 

            const box = new THREE.Box3().setFromObject(model); 
            const center = box.getCenter(new THREE.Vector3()); 
            const size = box.getSize(new THREE.Vector3()); 
            
            controls.target.copy(center); 

            const maxDim = Math.max(size.x, size.y, size.z); 
            camera.position.set(center.x, center.y + (maxDim * 0.4), maxDim * 2.5); 
            controls.update(); 
        }, undefined, function (error) { 
            console.error('An error happened while loading your model:', error); 
        }); 

        function animate() { 
            requestAnimationFrame(animate); 
            controls.update(); 
            renderer.render(scene, camera); 
        } 
        animate(); 

        window.addEventListener('resize', () => { 
            const width = container.clientWidth; 
            const height = container.clientHeight; 
            camera.aspect = width / height; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(width, height); 
        });
    </script> 
</body>
</html>
